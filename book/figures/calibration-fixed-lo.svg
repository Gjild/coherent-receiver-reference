<text x="35" y="505" font-family="sans-serif" font-size="18" fill="#182f3e" text-anchor="start">Training IF: 9, 10, 11.5 MHz; held-out IF: 10.5 MHz, with phase sidebands.</text>
<text x="35" y="545" font-family="sans-serif" font-size="17" fill="#182f3e" text-anchor="start">Q-to-O acquisition/channelizer phase is included unless independently de-embedded.</text>
<text x="35" y="585" font-family="sans-serif" font-size="17" fill="#182f3e" text-anchor="start">No retune, NCO reset or gain-state change during training; fixture slope remains a nuisance.</text>
<text x="32" y="646" font-family="sans-serif" font-size="16" fill="#182f3e" text-anchor="start">Illustrative model • no measured receiver data</text>
</svg>
