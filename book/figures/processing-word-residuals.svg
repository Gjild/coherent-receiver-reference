<path d="M100.000,162.000 L880.000,162.000" fill="none" stroke="#dae2e7" stroke-width="1" stroke-dasharray=""/>
<text x="880.0" y="382" font-family="sans-serif" font-size="17" fill="#182f3e" text-anchor="middle">29</text>
<text x="88" y="168.0" font-family="sans-serif" font-size="17" fill="#182f3e" text-anchor="end">40</text>
<path d="M100.000,162.000 L100.000,357.000 L880.000,357.000" fill="none" stroke="#263c49" stroke-width="1.5" stroke-dasharray=""/>
<text x="100" y="150" font-family="sans-serif" font-size="18" fill="#182f3e" text-anchor="start">Processing error (μV RMS; logarithmic scale)</text>
<text x="490.0" y="412" font-family="sans-serif" font-size="18" fill="#182f3e" text-anchor="middle">FIR coefficient fractional bits</text>
<path d="M100.000,90.000 L125.000,90.000" fill="none" stroke="#125b86" stroke-width="2.8" stroke-dasharray=""/>
<text x="133" y="95" font-family="sans-serif" font-size="16" fill="#125b86" text-anchor="start">exact integer chain; rounded 24-bit output</text>
<path d="M100.000,181.648 L230.000,248.083 L360.000,253.948 L490.000,313.848 L620.000,332.662 L750.000,336.338 L880.000,336.087" fill="none" stroke="#125b86" stroke-width="2.8" stroke-dasharray=""/>
<rect x="40" y="550" width="885" height="100" rx="5" fill="#edf4f8" stroke="#263c49"/>
<text x="482.5" y="575" font-family="sans-serif" font-size="18" fill="#182f3e" text-anchor="middle">F29 / 72-bit accumulator: 0.190134 μV RMS, no arithmetic overflow.</text>
<text x="482.5" y="600" font-family="sans-serif" font-size="18" fill="#182f3e" text-anchor="middle">F29 / 56-bit accumulator: 208040 wrap events; about 8.185 mV RMS error.</text>
<text x="482.5" y="625" font-family="sans-serif" font-size="18" fill="#182f3e" text-anchor="middle">Input codes may already contain converter bias: this comparison cannot remove it.</text>
<rect x="40" y="750" width="885" height="100" rx="5" fill="#edf4f8" stroke="#263c49"/>
<text x="482.5" y="775" font-family="sans-serif" font-size="18" fill="#182f3e" text-anchor="middle">Mixed products: F38; FIR coefficients: F29; accumulator: F67.</text>
<text x="482.5" y="800" font-family="sans-serif" font-size="18" fill="#182f3e" text-anchor="middle">A 72-bit accumulator and a 56-bit resampler accumulator have different binary points.</text>
<text x="482.5" y="825" font-family="sans-serif" font-size="18" fill="#182f3e" text-anchor="middle">Truncation is a deterministic operation, not a grant of independent white noise.</text>
<text x="45" y="950" font-family="sans-serif" font-size="18" fill="#182f3e" text-anchor="start">A full-band mask rejects F23 even when this one record has small coherent phase error.</text>
<text x="45" y="1010" font-family="sans-serif" font-size="17" fill="#182f3e" text-anchor="start">Complete payload, coefficient/memory paths and timing evidence still constrain implementation.</text>
<text x="32" y="1086" font-family="sans-serif" font-size="16" fill="#182f3e" text-anchor="start">Illustrative model • no measured receiver data</text>
</svg>
