<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 675" role="img" aria-labelledby="title desc"><title id="title">Geometry, transduction and electronics have different planes</title><desc id="desc">Synthetic mathematical illustration. See the caption and adjoining model for assumptions and interpretation.</desc>
<rect width="960" height="100%" fill="white"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#263c49"/></marker></defs>
<text x="32" y="32" font-family="sans-serif" font-size="23" fill="#182f3e" text-anchor="start">Geometry, transduction and electronics have different planes</text>
<text x="45" y="90" font-family="sans-serif" font-size="20" fill="#182f3e" text-anchor="start">Plane wave: travel direction −ell</text>
<path d="M700.000,120.000 L190.000,120.000" fill="none" stroke="#125b86" stroke-width="2.8" stroke-dasharray="" marker-end="url(#arrow)"/>
<circle cx="320" cy="225" r="7" fill="#125b86"/>
<text x="320" y="260" font-family="sans-serif" font-size="19" fill="#182f3e" text-anchor="middle">r₁</text>
<circle cx="650" cy="225" r="7" fill="#125b86"/>
<text x="650" y="260" font-family="sans-serif" font-size="19" fill="#182f3e" text-anchor="middle">r₂</text>
<path d="M320.000,225.000 L650.000,225.000" fill="none" stroke="#b34719" stroke-width="2.8" stroke-dasharray="" marker-end="url(#arrow)"/>
<text x="480" y="210" font-family="sans-serif" font-size="19" fill="#182f3e" text-anchor="middle">b = r₂ − r₁</text>
<path d="M320.000,300.000 L650.000,300.000" fill="none" stroke="#237550" stroke-width="2.8" stroke-dasharray="" marker-end="url(#arrow)"/>
<text x="700" y="305" font-family="sans-serif" font-size="19" fill="#182f3e" text-anchor="start">ell: sourceward</text>
<text x="50" y="350" font-family="sans-serif" font-size="20" fill="#182f3e" text-anchor="start">If ell · b &gt; 0: position 2 is earlier; Δτg &lt; 0, Δφg &gt; 0.</text>
<rect x="25" y="425" width="165" height="80" rx="5" fill="#edf4f8" stroke="#263c49"/>
<text x="107.5" y="450" font-family="sans-serif" font-size="18" fill="#182f3e" text-anchor="middle">Transverse field</text>
<text x="107.5" y="475" font-family="sans-serif" font-size="18" fill="#182f3e" text-anchor="middle">E⊥ (V/m)</text>
<rect x="245" y="425" width="165" height="80" rx="5" fill="#edf4f8" stroke="#263c49"/>
<text x="327.5" y="450" font-family="sans-serif" font-size="18" fill="#182f3e" text-anchor="middle">H (m)</text>
<text x="327.5" y="475" font-family="sans-serif" font-size="18" fill="#182f3e" text-anchor="middle">open-circuit V</text>
<rect x="465" y="425" width="200" height="80" rx="5" fill="#edf4f8" stroke="#263c49"/>
<text x="565.0" y="450" font-family="sans-serif" font-size="18" fill="#182f3e" text-anchor="middle">L = ZL (ZA+ZL)⁻¹</text>
<text x="565.0" y="475" font-family="sans-serif" font-size="18" fill="#182f3e" text-anchor="middle">loaded ports Q (V)</text>
<rect x="720" y="425" width="210" height="80" rx="5" fill="#edf4f8" stroke="#263c49"/>
<text x="825.0" y="450" font-family="sans-serif" font-size="18" fill="#182f3e" text-anchor="middle">G: normalized</text>
<text x="825.0" y="475" font-family="sans-serif" font-size="18" fill="#182f3e" text-anchor="middle">output z (V)</text>
<path d="M190.000,465.000 L245.000,465.000" fill="none" stroke="#125b86" stroke-width="2.8" stroke-dasharray="" marker-end="url(#arrow)"/>
<path d="M410.000,465.000 L465.000,465.000" fill="none" stroke="#125b86" stroke-width="2.8" stroke-dasharray="" marker-end="url(#arrow)"/>
<path d="M665.000,465.000 L720.000,465.000" fill="none" stroke="#125b86" stroke-width="2.8" stroke-dasharray="" marker-end="url(#arrow)"/>
<path d="M690.000,590.000 L690.000,465.000" fill="none" stroke="#b34719" stroke-width="2.8" stroke-dasharray="" marker-end="url(#arrow)"/>
<text x="400" y="625" font-family="sans-serif" font-size="20" fill="#182f3e" text-anchor="start">Injection at Q bypasses H and L</text>
<text x="32" y="661" font-family="sans-serif" font-size="16" fill="#182f3e" text-anchor="start">Illustrative model • no measured receiver data</text>
</svg>
