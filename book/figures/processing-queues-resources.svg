<text x="45" y="765" font-family="sans-serif" font-size="17" fill="#182f3e" text-anchor="start">Packed arrival incl. header: 192.75 MB/s; packet-event peak 239216 B; no modeled loss.</text>
<text x="45" y="825" font-family="sans-serif" font-size="18" fill="#182f3e" text-anchor="start">Padded components require 256.75 MB/s: the 240 MB/s link eventually loses data.</text>
<text x="45" y="885" font-family="sans-serif" font-size="18" fill="#182f3e" text-anchor="start">Symmetry + 8-point resampling: 9.28 G equivalent real operations/s for two receivers.</text>
<text x="45" y="945" font-family="sans-serif" font-size="17" fill="#182f3e" text-anchor="start">48 supplied wide-MAC lanes ×250 MHz: arithmetic capacity only; memory/schedule/timing unproved.</text>
<text x="45" y="1005" font-family="sans-serif" font-size="18" fill="#182f3e" text-anchor="start">Phase-index table: 32768 ×8 ×32 bits = 1 MiB; coefficient generation is not free.</text>
<text x="45" y="1065" font-family="sans-serif" font-size="17" fill="#182f3e" text-anchor="start">An async FIFO needs a qualified CDC implementation and device-specific metastability evidence.</text>
<text x="45" y="1125" font-family="sans-serif" font-size="18" fill="#182f3e" text-anchor="start">Plots are deterministic queue calculations, not measured link or FPGA performance.</text>
<text x="32" y="1206" font-family="sans-serif" font-size="16" fill="#182f3e" text-anchor="start">Illustrative model • no measured receiver data</text>
