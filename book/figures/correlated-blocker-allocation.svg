<text x="55" y="715" font-family="sans-serif" font-size="19" fill="#182f3e" text-anchor="start">Equal channel noise powers do not determine the comparison uncertainty.</text>
<text x="55" y="780" font-family="sans-serif" font-size="18" fill="#182f3e" text-anchor="start">Diagnostic only: T = 1 ms; RF-only departure SD = 1.8 K; ρ = 96.7531.</text>
<text x="55" y="825" font-family="sans-serif" font-size="18" fill="#182f3e" text-anchor="start">Calibration and ambient terms included; bounded mean contamination omitted here.</text>
<text x="55" y="875" font-family="sans-serif" font-size="18" fill="#182f3e" text-anchor="start">The closure figure instead uses a row-wise noise envelope covering that contamination.</text>
<text x="55" y="950" font-family="sans-serif" font-size="19" fill="#182f3e" text-anchor="start">q is allocated inside N₀, not added a second time to the complete noise floor.</text>
<text x="55" y="1010" font-family="sans-serif" font-size="18" fill="#182f3e" text-anchor="start">A single blocked-channel noise test cannot establish this cross-channel transfer.</text>
<text x="32" y="1066" font-family="sans-serif" font-size="16" fill="#182f3e" text-anchor="start">Illustrative model • no measured receiver data</text>
</svg>
