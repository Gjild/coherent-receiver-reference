<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 950" role="img" aria-labelledby="title desc"><title id="title">Preserve channel access and distinguish noise injection planes</title><desc id="desc">Synthetic mathematical illustration. See the caption and adjoining model for assumptions and interpretation.</desc>
