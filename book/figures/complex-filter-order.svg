<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title desc"><title id="title">Angle extraction and complex filtering do not commute</title><desc id="desc">Synthetic mathematical illustration. See the caption and adjoining model for assumptions and interpretation.</desc>
<rect width="960" height="100%" fill="white"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#263c49"/></marker></defs>
<text x="32" y="32" font-family="sans-serif" font-size="23" fill="#182f3e" text-anchor="start">Angle extraction and complex filtering do not commute</text>
<rect x="30" y="85" width="220" height="85" rx="5" fill="#edf4f8" stroke="#263c49"/>
<text x="140.0" y="110" font-family="sans-serif" font-size="18" fill="#182f3e" text-anchor="middle">Complex envelope z</text>
<text x="140.0" y="135" font-family="sans-serif" font-size="18" fill="#182f3e" text-anchor="middle">small α and φ, A &gt; 0</text>
<rect x="350" y="85" width="230" height="85" rx="5" fill="#edf4f8" stroke="#263c49"/>
<text x="465.0" y="110" font-family="sans-serif" font-size="18" fill="#182f3e" text-anchor="middle">Complex filter h</text>
<text x="465.0" y="135" font-family="sans-serif" font-size="18" fill="#182f3e" text-anchor="middle">H₀ = ∫h ≠ 0</text>
<rect x="700" y="85" width="220" height="85" rx="5" fill="#edf4f8" stroke="#263c49"/>
<text x="810.0" y="110" font-family="sans-serif" font-size="18" fill="#182f3e" text-anchor="middle">Extract angle</text>
<text x="810.0" y="135" font-family="sans-serif" font-size="18" fill="#182f3e" text-anchor="middle">about AH₀</text>
<path d="M250.000,125.000 L350.000,125.000" fill="none" stroke="#125b86" stroke-width="2.8" stroke-dasharray="" marker-end="url(#arrow)"/>
<path d="M580.000,125.000 L700.000,125.000" fill="none" stroke="#125b86" stroke-width="2.8" stroke-dasharray="" marker-end="url(#arrow)"/>
<text x="50" y="235" font-family="sans-serif" font-size="19" fill="#182f3e" text-anchor="start">Linearized output phase = Im(h/H₀)*α + Re(h/H₀)*φ + additive-noise term.</text>
<text x="50" y="270" font-family="sans-serif" font-size="18" fill="#182f3e" text-anchor="start">Require |h*δz| ≪ |AH₀| at the output, not only small input α and φ.</text>
<text x="50" y="305" font-family="sans-serif" font-size="19" fill="#182f3e" text-anchor="start">The imaginary part of the normalized impulse response converts AM to PM.</text>
<rect x="30" y="335" width="220" height="80" rx="5" fill="#edf4f8" stroke="#263c49"/>
<text x="140.0" y="360" font-family="sans-serif" font-size="18" fill="#182f3e" text-anchor="middle">Complex envelope z</text>
<rect x="350" y="335" width="230" height="80" rx="5" fill="#edf4f8" stroke="#263c49"/>
<text x="465.0" y="360" font-family="sans-serif" font-size="18" fill="#182f3e" text-anchor="middle">Extract phase</text>
<rect x="700" y="335" width="220" height="80" rx="5" fill="#edf4f8" stroke="#263c49"/>
<text x="810.0" y="360" font-family="sans-serif" font-size="18" fill="#182f3e" text-anchor="middle">Real phase filter B</text>
<path d="M250.000,375.000 L350.000,375.000" fill="none" stroke="#125b86" stroke-width="2.8" stroke-dasharray="" marker-end="url(#arrow)"/>
<path d="M580.000,375.000 L700.000,375.000" fill="none" stroke="#125b86" stroke-width="2.8" stroke-dasharray="" marker-end="url(#arrow)"/>
<text x="50" y="480" font-family="sans-serif" font-size="19" fill="#182f3e" text-anchor="start">Counterexample: h = (1+j, −j), H₀=1; AM-only samples (1.1, 1).</text>
<text x="50" y="520" font-family="sans-serif" font-size="19" fill="#182f3e" text-anchor="start">Complex-filter output = 1.1+j0.1; angle = 0.090660 rad (linearized: 0.1 rad).</text>
<text x="50" y="560" font-family="sans-serif" font-size="19" fill="#182f3e" text-anchor="start">Extracting the two input angles first gives zero; subsequent phase filtering stays zero.</text>
<text x="50" y="600" font-family="sans-serif" font-size="17" fill="#182f3e" text-anchor="start">Finite accuracy also requires filtered input and angle remainder bounds.</text>
<text x="32" y="626" font-family="sans-serif" font-size="16" fill="#182f3e" text-anchor="start">Illustrative model • no measured receiver data</text>
</svg>
