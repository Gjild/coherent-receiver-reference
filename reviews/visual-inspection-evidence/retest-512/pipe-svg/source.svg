<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" role="img" aria-labelledby="title desc">
<title id="title">Two-channel reference planes</title><desc id="desc">A common RF tone passes through uncertain fixture branches to P1 and P2. Each channel mixes with an endpoint LO at L1 or L2 and produces O1 or O2. Compare O2 times conjugate O1.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#24506a"/></marker></defs>
<rect width="920" height="400" fill="white"/>
<g fill="#edf4f8" stroke="#24506a" stroke-width="2"><rect x="20" y="90" width="140" height="130"/><rect x="390" y="70" width="160" height="60"/><rect x="390" y="190" width="160" height="60"/><rect x="610" y="110" width="280" height="110"/><rect x="230" y="290" width="400" height="70"/></g>
<g fill="#183446" font-family="sans-serif" font-size="17"><text x="35" y="140">Common tone</text><text x="35" y="170">1 GHz</text><text x="410" y="106">Receiver 1</text><text x="410" y="226">Receiver 2</text><text x="630" y="150">Compare p = z₂ z₁*</text><text x="630" y="183">simultaneous observation</text><text x="245" y="317">Shared LO + branches OR two local</text><text x="245" y="344">synthesizers locked to one reference</text><text x="190" y="75">Fixture 1</text><text x="190" y="185">Fixture 2</text><text x="330" y="95">P1</text><text x="330" y="215">P2</text><text x="565" y="88">O1</text><text x="565" y="238">O2</text><text x="365" y="150">L1</text><text x="465" y="275">L2</text></g>
<g fill="none" stroke="#24506a" stroke-width="2" marker-end="url(#arrow)"><path d="M160 110 H390"/><path d="M160 200 H390"/><path d="M550 100 H600 V135 H610"/><path d="M550 220 H600 V195 H610"/><path d="M350 290 V150 H430 V130"/><path d="M480 290 V250"/></g>
</svg>
