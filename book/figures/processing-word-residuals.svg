<text x="32" y="32" font-family="sans-serif" font-size="23" fill="#182f3e" text-anchor="start">A favorable tone phase can hide a failed precision or bandwidth decision</text>
<text x="100" y="70" font-family="sans-serif" font-size="20" fill="#182f3e" text-anchor="start">8192 identical 16-bit input words; discard incomplete FIR history</text>
