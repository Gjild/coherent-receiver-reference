<text x="32" y="32" font-family="sans-serif" font-size="23" fill="#182f3e" text-anchor="start">A justified error bound permits a guarded scalar decision</text>
<text x="40" y="85" font-family="sans-serif" font-size="18" fill="#182f3e" text-anchor="start">Dimensionless example: upper limit L = 1; guaranteed error bound U = 0.2.</text>
