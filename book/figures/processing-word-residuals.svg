<path d="M100.000,259.500 L880.000,259.500" fill="none" stroke="#dae2e7" stroke-width="1" stroke-dasharray=""/>
<text x="490.0" y="382" font-family="sans-serif" font-size="17" fill="#182f3e" text-anchor="middle">23</text>
<text x="88" y="265.5" font-family="sans-serif" font-size="17" fill="#182f3e" text-anchor="end">2</text>
<path d="M685.000,162.000 L685.000,357.000" fill="none" stroke="#dae2e7" stroke-width="1" stroke-dasharray=""/>
<path d="M100.000,210.750 L880.000,210.750" fill="none" stroke="#dae2e7" stroke-width="1" stroke-dasharray=""/>
