<text x="535.0" y="175" font-family="sans-serif" font-size="18" fill="#182f3e" text-anchor="middle">Receiver 1</text>
<text x="535.0" y="200" font-family="sans-serif" font-size="18" fill="#182f3e" text-anchor="middle">RF / IF response</text>
<rect x="690" y="150" width="230" height="90" rx="5" fill="#edf4f8" stroke="#263c49"/>
<text x="805.0" y="175" font-family="sans-serif" font-size="18" fill="#182f3e" text-anchor="middle">32 Msample/s I/Q</text>
