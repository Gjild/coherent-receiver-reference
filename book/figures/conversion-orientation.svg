<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 495" role="img" aria-labelledby="title desc"><title id="title">Positive-IF extraction changes input orientation, not added IF phase</title><desc id="desc">Synthetic mathematical illustration. See the caption and adjoining model for assumptions and interpretation.</desc>
<rect width="960" height="100%" fill="white"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#263c49"/></marker></defs>
<text x="32" y="32" font-family="sans-serif" font-size="23" fill="#182f3e" text-anchor="start">Positive-IF extraction changes input orientation, not added IF phase</text>
<rect x="35" y="95" width="240" height="90" rx="5" fill="#edf4f8" stroke="#263c49"/>
<text x="155.0" y="120" font-family="sans-serif" font-size="18" fill="#182f3e" text-anchor="middle">RF 1000 − LO 990 MHz</text>
<text x="155.0" y="145" font-family="sans-serif" font-size="18" fill="#182f3e" text-anchor="middle">signed difference: +10 MHz</text>
<path d="M280.000,140.000 L370.000,140.000" fill="none" stroke="#125b86" stroke-width="2.8" stroke-dasharray="" marker-end="url(#arrow)"/>
<rect x="375" y="95" width="525" height="90" rx="5" fill="#edf4f8" stroke="#263c49"/>
<text x="637.5" y="120" font-family="sans-serif" font-size="18" fill="#182f3e" text-anchor="middle">Extract at positive 10 MHz</text>
<text x="637.5" y="145" font-family="sans-serif" font-size="18" fill="#182f3e" text-anchor="middle">Δφ − Δλ + Δβ = +40°</text>
<text x="45" y="220" font-family="sans-serif" font-size="18" fill="#182f3e" text-anchor="start">Δφ = 45° at P; Δλ = 12° at L; Δβ = +7° added at positive IF.</text>
<rect x="35" y="265" width="240" height="90" rx="5" fill="#edf4f8" stroke="#263c49"/>
<text x="155.0" y="290" font-family="sans-serif" font-size="18" fill="#182f3e" text-anchor="middle">RF 1000 − LO 1010 MHz</text>
<text x="155.0" y="315" font-family="sans-serif" font-size="18" fill="#182f3e" text-anchor="middle">signed difference: -10 MHz</text>
<path d="M280.000,310.000 L370.000,310.000" fill="none" stroke="#125b86" stroke-width="2.8" stroke-dasharray="" marker-end="url(#arrow)"/>
<rect x="375" y="265" width="525" height="90" rx="5" fill="#edf4f8" stroke="#263c49"/>
<text x="637.5" y="290" font-family="sans-serif" font-size="18" fill="#182f3e" text-anchor="middle">Extract at positive 10 MHz</text>
<text x="637.5" y="315" font-family="sans-serif" font-size="18" fill="#182f3e" text-anchor="middle">−Δφ + Δλ + Δβ = -26°</text>
<text x="45" y="390" font-family="sans-serif" font-size="18" fill="#182f3e" text-anchor="start">Δφ = 45° at P; Δλ = 12° at L; Δβ = +7° added at positive IF.</text>
<text x="32" y="481" font-family="sans-serif" font-size="16" fill="#182f3e" text-anchor="start">Illustrative model • no measured receiver data</text>
</svg>
