<text x="715.0" y="565" font-family="sans-serif" font-size="18" fill="#182f3e" text-anchor="middle">Known identity retained after a gap</text>
<text x="715.0" y="590" font-family="sans-serif" font-size="18" fill="#182f3e" text-anchor="middle">do not renumber the NCO or timestamps</text>
<text x="715.0" y="615" font-family="sans-serif" font-size="18" fill="#182f3e" text-anchor="middle">unknown identity needs a new reference event</text>
<rect x="40" y="750" width="885" height="100" rx="5" fill="#edf4f8" stroke="#263c49"/>
<text x="482.5" y="775" font-family="sans-serif" font-size="18" fill="#182f3e" text-anchor="middle">A decimator-origin shift with absolute NCO phase changes only the baseband epoch.</text>
<text x="482.5" y="800" font-family="sans-serif" font-size="18" fill="#182f3e" text-anchor="middle">A retune/reset must identify NCO phase, filter history, coefficient set and rate state.</text>
<text x="482.5" y="825" font-family="sans-serif" font-size="18" fill="#182f3e" text-anchor="middle">A lost output packet does not have the same support contamination as a lost raw sample.</text>
<text x="45" y="940" font-family="sans-serif" font-size="18" fill="#182f3e" text-anchor="start">Settled errors here: −90° from NCO state, +56.25° from raw loss plus renumbering.</text>
<text x="45" y="1000" font-family="sans-serif" font-size="17" fill="#182f3e" text-anchor="start">Principal phase can jump during the invalid transition; these are diagnostic, not valid data.</text>
<text x="45" y="1060" font-family="sans-serif" font-size="18" fill="#182f3e" text-anchor="start">Control/data-valid flags and elapsed time alone cannot establish coherent recovery.</text>
<text x="32" y="1106" font-family="sans-serif" font-size="16" fill="#182f3e" text-anchor="start">Illustrative model • no measured receiver data</text>
