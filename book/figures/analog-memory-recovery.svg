<text x="45" y="505" font-family="sans-serif" font-size="19" fill="#182f3e" text-anchor="start">Post-pulse weak response: (1 − 0.1q) exp[j (8°)q] times its calibrated state.</text>
<text x="45" y="560" font-family="sans-serif" font-size="18" fill="#182f3e" text-anchor="start">The memoryless model sets q = 0 as soon as the pulse ends; it fails this example.</text>
<text x="45" y="615" font-family="sans-serif" font-size="18" fill="#182f3e" text-anchor="start">Specific pulse reaches 0.1° after 169.465 μs; q₀ ≤ 1 needs 175.281 μs.</text>
<text x="45" y="670" font-family="sans-serif" font-size="18" fill="#182f3e" text-anchor="start">Gain-state settling adds phase: budget the sum, not two separate full allowances.</text>
<text x="45" y="725" font-family="sans-serif" font-size="18" fill="#182f3e" text-anchor="start">A 176 μs hold passes with the stated concurrent gain transition and 40 μs bound.</text>
<text x="45" y="780" font-family="sans-serif" font-size="18" fill="#182f3e" text-anchor="start">Doubling the recovery constant doubles the memory wait: the 180 μs deadline fails.</text>
<text x="45" y="835" font-family="sans-serif" font-size="18" fill="#182f3e" text-anchor="start">These exponential coefficients are a synthetic envelope, not a measured device model.</text>
<text x="45" y="895" font-family="sans-serif" font-size="18" fill="#182f3e" text-anchor="start">Characterize pulse width / spacing, level, bias, temperature and load before adopting it.</text>
