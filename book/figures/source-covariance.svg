<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" role="img" aria-labelledby="title desc"><title id="title">Construct channel covariance from shared and local sources</title><desc id="desc">Synthetic mathematical illustration. See the caption and adjoining model for assumptions and interpretation.</desc>
<rect width="960" height="100%" fill="white"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#263c49"/></marker></defs>
<text x="32" y="32" font-family="sans-serif" font-size="23" fill="#182f3e" text-anchor="start">Construct channel covariance from shared and local sources</text>
<g transform="translate(0 60)">
<rect x="30" y="170" width="180" height="80" rx="5" fill="#edf4f8" stroke="#263c49"/>
<text x="120.0" y="195" font-family="sans-serif" font-size="18" fill="#182f3e" text-anchor="middle">Shared source u</text>
<text x="120.0" y="220" font-family="sans-serif" font-size="18" fill="#182f3e" text-anchor="middle">RMS 0.02 rad</text>
<rect x="360" y="20" width="180" height="65" rx="5" fill="#edf4f8" stroke="#263c49"/>
<text x="450.0" y="45" font-family="sans-serif" font-size="18" fill="#182f3e" text-anchor="middle">Local e₁</text>
<text x="450.0" y="70" font-family="sans-serif" font-size="18" fill="#182f3e" text-anchor="middle">RMS 0.01 rad</text>
<rect x="360" y="385" width="180" height="65" rx="5" fill="#edf4f8" stroke="#263c49"/>
<text x="450.0" y="410" font-family="sans-serif" font-size="18" fill="#182f3e" text-anchor="middle">Local e₂</text>
<text x="450.0" y="435" font-family="sans-serif" font-size="18" fill="#182f3e" text-anchor="middle">RMS 0.03 rad</text>
<rect x="610" y="80" width="300" height="75" rx="5" fill="#edf4f8" stroke="#263c49"/>
<text x="760.0" y="105" font-family="sans-serif" font-size="18" fill="#182f3e" text-anchor="middle">x₁ = u + e₁</text>
<text x="760.0" y="130" font-family="sans-serif" font-size="18" fill="#182f3e" text-anchor="middle">channel 1 phase</text>
<rect x="610" y="270" width="300" height="75" rx="5" fill="#edf4f8" stroke="#263c49"/>
<text x="760.0" y="295" font-family="sans-serif" font-size="18" fill="#182f3e" text-anchor="middle">x₂ = 2u + e₂</text>
<text x="760.0" y="320" font-family="sans-serif" font-size="18" fill="#182f3e" text-anchor="middle">channel 2 phase</text>
<path d="M210.000,210.000 L260.000,210.000" fill="none" stroke="#125b86" stroke-width="2.8" stroke-dasharray=""/>
<circle cx="260" cy="210" r="4" fill="#125b86"/>
<path d="M260.000,210.000 L260.000,117.000 L610.000,117.000" fill="none" stroke="#125b86" stroke-width="2.8" stroke-dasharray="" marker-end="url(#arrow)"/>
<text x="380" y="104" font-family="sans-serif" font-size="17" fill="#182f3e" text-anchor="start">sensitivity 1</text>
<path d="M260.000,210.000 L260.000,307.000 L610.000,307.000" fill="none" stroke="#125b86" stroke-width="2.8" stroke-dasharray="" marker-end="url(#arrow)"/>
<text x="380" y="294" font-family="sans-serif" font-size="17" fill="#182f3e" text-anchor="start">sensitivity 2</text>
<path d="M540.000,52.000 L760.000,52.000 L760.000,80.000" fill="none" stroke="#b34719" stroke-width="2.8" stroke-dasharray="" marker-end="url(#arrow)"/>
<path d="M540.000,417.000 L760.000,417.000 L760.000,345.000" fill="none" stroke="#237550" stroke-width="2.8" stroke-dasharray="" marker-end="url(#arrow)"/>
<text x="35" y="480" font-family="sans-serif" font-size="18" fill="#182f3e" text-anchor="start">u, e₁, e₂ mutually independent and centered; all gains are phase sensitivities.</text>
</g>
<text x="32" y="566" font-family="sans-serif" font-size="16" fill="#182f3e" text-anchor="start">Illustrative model • no measured receiver data</text>
</svg>
