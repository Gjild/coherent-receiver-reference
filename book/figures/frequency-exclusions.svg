<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1040" role="img" aria-labelledby="title desc"><title id="title">Different analog paths can become the same sampled band</title><desc id="desc">Synthetic mathematical illustration. See the caption and adjoining model for assumptions and interpretation.</desc>
<rect width="960" height="100%" fill="white"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#263c49"/></marker></defs>
<text x="32" y="32" font-family="sans-serif" font-size="23" fill="#182f3e" text-anchor="start">Different analog paths can become the same sampled band</text>
<text x="50" y="85" font-family="sans-serif" font-size="19" fill="#182f3e" text-anchor="start">First three rows: +50 kHz; blocker: +100 Hz. Frequency values in MHz.</text>
<text x="60" y="155" font-family="sans-serif" font-size="18" fill="#182f3e" text-anchor="start">RF</text>
<text x="300" y="155" font-family="sans-serif" font-size="18" fill="#182f3e" text-anchor="start">positive real IF</text>
<text x="560" y="155" font-family="sans-serif" font-size="18" fill="#182f3e" text-anchor="start">positive sampled image</text>
<text x="800" y="155" font-family="sans-serif" font-size="18" fill="#182f3e" text-anchor="start">restored output</text>
<text x="50" y="200" font-family="sans-serif" font-size="19" fill="#125b86" text-anchor="start">wanted</text>
<text x="60" y="230" font-family="sans-serif" font-size="19" fill="#125b86" text-anchor="start">1000.05</text>
<text x="330" y="230" font-family="sans-serif" font-size="19" fill="#125b86" text-anchor="start">19.95</text>
<text x="590" y="230" font-family="sans-serif" font-size="19" fill="#125b86" text-anchor="start">19.95</text>
<text x="820" y="230" font-family="sans-serif" font-size="19" fill="#125b86" text-anchor="start">0.05</text>
<path d="M170.000,223.000 L300.000,223.000" fill="none" stroke="#125b86" stroke-width="2.8" stroke-dasharray="" marker-end="url(#arrow)"/>
<path d="M430.000,223.000 L560.000,223.000" fill="none" stroke="#125b86" stroke-width="2.8" stroke-dasharray="" marker-end="url(#arrow)"/>
<path d="M690.000,223.000 L790.000,223.000" fill="none" stroke="#125b86" stroke-width="2.8" stroke-dasharray="" marker-end="url(#arrow)"/>
<text x="50" y="340" font-family="sans-serif" font-size="19" fill="#b34719" text-anchor="start">RF image</text>
<text x="60" y="370" font-family="sans-serif" font-size="19" fill="#b34719" text-anchor="start">1040.05</text>
<text x="330" y="370" font-family="sans-serif" font-size="19" fill="#b34719" text-anchor="start">20.05</text>
<text x="590" y="370" font-family="sans-serif" font-size="19" fill="#b34719" text-anchor="start">20.05</text>
<text x="820" y="370" font-family="sans-serif" font-size="19" fill="#b34719" text-anchor="start">-0.05</text>
<path d="M170.000,363.000 L300.000,363.000" fill="none" stroke="#b34719" stroke-width="2.8" stroke-dasharray="" marker-end="url(#arrow)"/>
<path d="M430.000,363.000 L560.000,363.000" fill="none" stroke="#b34719" stroke-width="2.8" stroke-dasharray="" marker-end="url(#arrow)"/>
<path d="M690.000,363.000 L790.000,363.000" fill="none" stroke="#b34719" stroke-width="2.8" stroke-dasharray="" marker-end="url(#arrow)"/>
<text x="50" y="480" font-family="sans-serif" font-size="19" fill="#237550" text-anchor="start">sample alias</text>
<text x="60" y="510" font-family="sans-serif" font-size="19" fill="#237550" text-anchor="start">1100.05</text>
<text x="330" y="510" font-family="sans-serif" font-size="19" fill="#237550" text-anchor="start">80.05</text>
<text x="590" y="510" font-family="sans-serif" font-size="19" fill="#237550" text-anchor="start">19.95</text>
<text x="820" y="510" font-family="sans-serif" font-size="19" fill="#237550" text-anchor="start">0.05</text>
<path d="M170.000,503.000 L300.000,503.000" fill="none" stroke="#237550" stroke-width="2.8" stroke-dasharray="" marker-end="url(#arrow)"/>
<path d="M430.000,503.000 L560.000,503.000" fill="none" stroke="#237550" stroke-width="2.8" stroke-dasharray="" marker-end="url(#arrow)"/>
<path d="M690.000,503.000 L790.000,503.000" fill="none" stroke="#237550" stroke-width="2.8" stroke-dasharray="" marker-end="url(#arrow)"/>
<text x="50" y="620" font-family="sans-serif" font-size="19" fill="#763c87" text-anchor="start">blocker</text>
<text x="60" y="650" font-family="sans-serif" font-size="19" fill="#763c87" text-anchor="start">1010.0001</text>
<text x="330" y="650" font-family="sans-serif" font-size="19" fill="#763c87" text-anchor="start">9.9999</text>
<text x="590" y="650" font-family="sans-serif" font-size="19" fill="#763c87" text-anchor="start">9.9999</text>
<text x="820" y="650" font-family="sans-serif" font-size="19" fill="#763c87" text-anchor="start">10.0001</text>
<path d="M170.000,643.000 L300.000,643.000" fill="none" stroke="#763c87" stroke-width="2.8" stroke-dasharray="" marker-end="url(#arrow)"/>
<path d="M430.000,643.000 L560.000,643.000" fill="none" stroke="#763c87" stroke-width="2.8" stroke-dasharray="" marker-end="url(#arrow)"/>
<path d="M690.000,643.000 L790.000,643.000" fill="none" stroke="#763c87" stroke-width="2.8" stroke-dasharray="" marker-end="url(#arrow)"/>
<text x="50" y="800" font-family="sans-serif" font-size="18" fill="#182f3e" text-anchor="start">Desired/image passbands both land at 20 ± 0.1 MHz: analog exclusion required.</text>
<text x="50" y="845" font-family="sans-serif" font-size="18" fill="#182f3e" text-anchor="start">80 ± 0.1 MHz folds onto the same real band: digital processing cannot separate it.</text>
<text x="50" y="890" font-family="sans-serif" font-size="18" fill="#182f3e" text-anchor="start">Blocker stays out of band, but its finite-record leakage must still be bounded.</text>
<text x="50" y="952" font-family="sans-serif" font-size="19" fill="#182f3e" text-anchor="start">A band map specifies where attenuation is needed; it does not supply attenuation.</text>
<text x="32" y="1026" font-family="sans-serif" font-size="16" fill="#182f3e" text-anchor="start">Illustrative model • no measured receiver data</text>
</svg>
