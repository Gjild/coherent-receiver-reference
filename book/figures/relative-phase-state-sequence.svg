<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 220" role="img" aria-labelledby="title desc">
<title id="title">State and calibration validity</title><desc id="desc">Reset or retune, settle, calibrate, independently verify, then valid use. State changes invalidate the earlier calibration.</desc>
<rect width="920" height="220" fill="white"/>
<g fill="#edf4f8" stroke="#24506a" stroke-width="2"><rect x="15" y="45" width="160" height="65"/><rect x="200" y="45" width="130" height="65"/><rect x="355" y="45" width="150" height="65"/><rect x="530" y="45" width="170" height="65"/><rect x="725" y="45" width="175" height="65"/></g>
<g fill="#183446" font-family="sans-serif" font-size="17"><text x="30" y="85">Reset / retune</text><text x="225" y="85">Settle</text><text x="375" y="85">Calibrate</text><text x="548" y="85">Held-out check</text><text x="750" y="85">Valid use</text><text x="177" y="85">→</text><text x="332" y="85">→</text><text x="507" y="85">→</text><text x="702" y="85">→</text><text x="40" y="155">Store state, epoch, temperature, levels and calibration version at every stage.</text><text x="40" y="187">New state, stale calibration, loss of reference or invalid amplitude → gate data and reassess.</text></g></svg>
