<text x="780" y="295" font-family="sans-serif" font-size="20" fill="#182f3e" text-anchor="start">Δ = +40°</text>
<text x="570" y="405" font-family="sans-serif" font-size="17" fill="#182f3e" text-anchor="start">I (V); Q (V), equal axis scales</text>
<text x="55" y="445" font-family="sans-serif" font-size="18" fill="#182f3e" text-anchor="start">Blue: z₁; orange: z₂. Positive arc runs from z₁ to z₂.</text>
<text x="55" y="480" font-family="sans-serif" font-size="19" fill="#182f3e" text-anchor="start">Both magnitudes: 0.10 V peak; carrier 10 MHz; common epoch.</text>
<text x="55" y="525" font-family="sans-serif" font-size="19" fill="#182f3e" text-anchor="start">z₂ z₁* = 0.010 exp(j40°) V² in either reference.</text>
<text x="55" y="570" font-family="sans-serif" font-size="19" fill="#182f3e" text-anchor="start">Conjugating BOTH channels reverses Q and gives −40°.</text>
<text x="55" y="615" font-family="sans-serif" font-size="19" fill="#182f3e" text-anchor="start">Absolute phasor angles depend on the chosen reference; their difference does not.</text>
