<text x="80" y="815" font-family="sans-serif" font-size="18" fill="#182f3e" text-anchor="start">At δ = 90° the desired complex sum cancels; correct relative phasing restores it.</text>
<text x="80" y="865" font-family="sans-serif" font-size="18" fill="#182f3e" text-anchor="start">Noncoherent Q₄ retains energy but has a gamma null, not the coherent null.</text>
<text x="80" y="915" font-family="sans-serif" font-size="18" fill="#182f3e" text-anchor="start">A nonzero mean/energy is not by itself a detection probability.</text>
