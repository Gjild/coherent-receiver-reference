<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 910" role="img" aria-labelledby="title desc"><title id="title">Preselection can create a gain interval; digital cleanup cannot</title><desc id="desc">Synthetic mathematical illustration. See the caption and adjoining model for assumptions and interpretation.</desc>
<rect width="960" height="100%" fill="white"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#263c49"/></marker></defs>
<text x="32" y="32" font-family="sans-serif" font-size="23" fill="#182f3e" text-anchor="start">Preselection can create a gain interval; digital cleanup cannot</text>
<text x="50" y="85" font-family="sans-serif" font-size="21" fill="#182f3e" text-anchor="start">P0 → RF selector → P1 → gain/conversion G → P2 digitizer</text>
<text x="50" y="128" font-family="sans-serif" font-size="19" fill="#182f3e" text-anchor="start">Wanted −100 dBm; blocker −20 dBm at P0. Equal 50 Ω planes.</text>
<text x="50" y="168" font-family="sans-serif" font-size="19" fill="#182f3e" text-anchor="start">Selector family: wanted loss 2 dB; total blocker attenuation Aᵦ.</text>
<text x="100" y="235" font-family="sans-serif" font-size="20" fill="#182f3e" text-anchor="start">Both visibility and composite peak must pass at the same gain</text>
