<text x="100.0" y="345" font-family="sans-serif" font-size="18" fill="#182f3e" text-anchor="middle">s[n] + u[n]</text>
<rect x="230" y="320" width="275" height="65" rx="5" fill="#edf4f8" stroke="#263c49"/>
<text x="367.5" y="345" font-family="sans-serif" font-size="18" fill="#182f3e" text-anchor="middle">H_B = g z^-5 (1 − a z^-1)</text>
