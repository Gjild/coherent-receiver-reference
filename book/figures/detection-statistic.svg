<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 930" role="img" aria-labelledby="title desc"><title id="title">A detection claim needs hypotheses, a statistic and a threshold</title><desc id="desc">Synthetic mathematical illustration. See the caption and adjoining model for assumptions and interpretation.</desc>
<rect width="960" height="100%" fill="white"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#263c49"/></marker></defs>
<text x="32" y="32" font-family="sans-serif" font-size="23" fill="#182f3e" text-anchor="start">A detection claim needs hypotheses, a statistic and a threshold</text>
<rect x="30" y="100" width="200" height="85" rx="5" fill="#edf4f8" stroke="#263c49"/>
<text x="130.0" y="125" font-family="sans-serif" font-size="18" fill="#182f3e" text-anchor="middle">Finite record x</text>
<text x="130.0" y="150" font-family="sans-serif" font-size="18" fill="#182f3e" text-anchor="middle">known C and a</text>
<rect x="295" y="100" width="250" height="85" rx="5" fill="#edf4f8" stroke="#263c49"/>
<text x="420.0" y="125" font-family="sans-serif" font-size="18" fill="#182f3e" text-anchor="middle">Whiten x AND a</text>
<text x="420.0" y="150" font-family="sans-serif" font-size="18" fill="#182f3e" text-anchor="middle">t = aᴴ C⁻¹ x</text>
<rect x="620" y="100" width="300" height="85" rx="5" fill="#edf4f8" stroke="#263c49"/>
<text x="770.0" y="125" font-family="sans-serif" font-size="18" fill="#182f3e" text-anchor="middle">r = t / √q</text>
<text x="770.0" y="150" font-family="sans-serif" font-size="18" fill="#182f3e" text-anchor="middle">Z = √2 Re r &gt; γ</text>
<path d="M230.000,142.000 L295.000,142.000" fill="none" stroke="#125b86" stroke-width="2.8" stroke-dasharray="" marker-end="url(#arrow)"/>
<path d="M545.000,142.000 L620.000,142.000" fill="none" stroke="#125b86" stroke-width="2.8" stroke-dasharray="" marker-end="url(#arrow)"/>
<text x="50" y="255" font-family="sans-serif" font-size="20" fill="#182f3e" text-anchor="start">Proper complex Gaussian noise; q = aᴴC⁻¹a, ρ = A²q.</text>
<text x="50" y="305" font-family="sans-serif" font-size="18" fill="#182f3e" text-anchor="start">Known phase; one specified test, α = 0.001. Geometry and state fixed.</text>
<text x="100" y="365" font-family="sans-serif" font-size="20" fill="#182f3e" text-anchor="start">Worked detector: A/σ = 4, template separation 30°</text>
