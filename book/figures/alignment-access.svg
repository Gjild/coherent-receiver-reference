<text x="540.0" y="555" font-family="sans-serif" font-size="18" fill="#182f3e" text-anchor="middle">Retain separate complex data until alignment is justified</text>
<text x="540.0" y="580" font-family="sans-serif" font-size="18" fill="#182f3e" text-anchor="middle">Before-path noise u passes through H and Q</text>
<text x="540.0" y="605" font-family="sans-serif" font-size="18" fill="#182f3e" text-anchor="middle">After-path noise v is multiplied by the inverse</text>
<text x="45" y="720" font-family="sans-serif" font-size="18" fill="#182f3e" text-anchor="start">Same input is a supplied calibration/illumination model, not a universal array manifold.</text>
<text x="45" y="775" font-family="sans-serif" font-size="19" fill="#182f3e" text-anchor="start">An analog sum can erase a mode before digital correction has access to it.</text>
<text x="45" y="830" font-family="sans-serif" font-size="18" fill="#182f3e" text-anchor="start">Reference planes, loading, state and admissible input range are part of H.</text>
<text x="32" y="936" font-family="sans-serif" font-size="16" fill="#182f3e" text-anchor="start">Illustrative model • no measured receiver data</text>
