<text x="55" y="580" font-family="sans-serif" font-size="19" fill="#182f3e" text-anchor="start">At |offset| = 100 Hz: |H| ≈ 7.39 × 10⁻⁶ before finite observation.</text>
<text x="55" y="635" font-family="sans-serif" font-size="19" fill="#182f3e" text-anchor="start">Both real images then enter the exact 100000-sample geometric sum.</text>
<text x="55" y="680" font-family="sans-serif" font-size="20" fill="#237550" text-anchor="start">Composite blocker paths / wanted main path ≤ 1.3 × 10⁻¹⁰</text>
<text x="55" y="720" font-family="sans-serif" font-size="18" fill="#182f3e" text-anchor="start">for both offsets ±100 Hz, coefficient error ≤ 10⁻⁶, steady exact arithmetic.</text>
<text x="55" y="785" font-family="sans-serif" font-size="19" fill="#182f3e" text-anchor="start">This model clears the 10⁻⁵ interface; it does not certify deployed rejection.</text>
<text x="55" y="840" font-family="sans-serif" font-size="18" fill="#182f3e" text-anchor="start">Omitted: arithmetic noise/overflow, analog aliases/spurs, transients and clocks.</text>
<text x="55" y="900" font-family="sans-serif" font-size="18" fill="#182f3e" text-anchor="start">A reset that fills missing FIR history with zeros invalidates the steady-tone result.</text>
<text x="55" y="990" font-family="sans-serif" font-size="19" fill="#182f3e" text-anchor="start">Noise and resource budgets must be reconciled with this changed observation.</text>
