<text x="45" y="720" font-family="sans-serif" font-size="20" fill="#182f3e" text-anchor="start">5 ps → 1.76915°; 0.01° from skew alone needs ≤28.2667 fs.</text>
<text x="45" y="780" font-family="sans-serif" font-size="19" fill="#182f3e" text-anchor="start">Gain mismatch alone needs ≤7.81461 ppm; offset mismatch appears at Fs / 2.</text>
<text x="45" y="840" font-family="sans-serif" font-size="17" fill="#182f3e" text-anchor="start">The original 40 MHz blocker is replaced by 44 MHz here; earlier jitter numbers do not transfer.</text>
<text x="45" y="900" font-family="sans-serif" font-size="18" fill="#182f3e" text-anchor="start">Prevention, a different architecture or characterized correction require a new comparison.</text>
<text x="45" y="960" font-family="sans-serif" font-size="18" fill="#182f3e" text-anchor="start">Bus interleaving / channel multiplexing does not imply this analog-aperture model.</text>
<text x="45" y="1035" font-family="sans-serif" font-size="18" fill="#182f3e" text-anchor="start">Real frequency/level/state-dependent mismatch needs examined data.</text>
