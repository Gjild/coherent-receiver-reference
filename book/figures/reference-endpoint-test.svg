<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1140" role="img" aria-labelledby="title desc"><title id="title">Measure the reference delivered at each receiver endpoint</title><desc id="desc">Synthetic mathematical illustration. See the caption and adjoining model for assumptions and interpretation.</desc>
